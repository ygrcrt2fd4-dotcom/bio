<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioQuiz 2.0</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background:
        radial-gradient(circle at 15% 20%, #164e63 0%, transparent 30%),
        radial-gradient(circle at 85% 80%, #312e81 0%, transparent 30%),
        #050812;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}
.container {
    width: 100%;
    max-width: 760px;
}
/* KARTA */
.card {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 30px;
    padding: 32px;
    box-shadow: 0 30px 90px rgba(0,0,0,.5);
    backdrop-filter: blur(25px);
    animation: cardIn .6s ease;
}
@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
/* ÚVOD */
#startScreen {
    text-align: center;
}
.dna {
    font-size: 70px;
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }
    50% {
        transform: translateY(-12px) rotate(3deg);
    }
}
.logo {
    color: #67e8f9;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 15px;
}
h1 {
    font-size: 42px;
    margin: 8px 0;
}
.gradient {
    background: linear-gradient(90deg,#22d3ee,#818cf8,#c084fc);
    -webkit-background-clip: text;
    color: transparent;
}
.subtitle {
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 28px;
}
.name-input {
    width: 100%;
    padding: 17px;
    border-radius: 16px;
    border: 1px solid #334155;
    background: #0f172a;
    color: white;
    font-size: 16px;
    outline: none;
    margin-bottom: 14px;
}
.name-input:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 0 3px rgba(34,211,238,.12);
}
/* TLAČIDLÁ */
.main-btn {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 17px;
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(135deg,#06b6d4,#6366f1,#8b5cf6);
    transition: .25s;
}
.main-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(99,102,241,.35);
}
.info {
    display: flex;
    justify-content: center;
    gap: 20px;
    color: #94a3b8;
    font-size: 14px;
    margin-top: 20px;
}
/* QUIZ */
#quizScreen {
    display: none;
}
.quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}
.player {
    color: #67e8f9;
    font-weight: 700;
}
.question-count {
    color: #94a3b8;
}
.progress {
    width: 100%;
    height: 7px;
    background: #1e293b;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
}
.progress-bar {
    height: 100%;
    width: 10%;
    background: linear-gradient(90deg,#22d3ee,#8b5cf6);
    transition: width .4s ease;
}
/* TIMER */
.timer-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(30,41,59,.7);
    border: 1px solid #334155;
    width: 90px;
    padding: 10px;
    border-radius: 14px;
    font-weight: 800;
}
.timer-danger {
    color: #fb7185;
    border-color: #fb7185;
    animation: danger .7s infinite alternate;
}
@keyframes danger {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.06);
    }
}
/* OTÁZKA */
.question {
    font-size: 24px;
    line-height: 1.4;
    margin: 20px 0;
    animation: questionIn .35s ease;
}
@keyframes questionIn {
    from {
        opacity: 0;
        transform: translateX(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}
/* ODPOVEDE */
.answers {
    display: grid;
    gap: 12px;
}
.answer {
    width: 100%;
    padding: 17px;
    text-align: left;
    background: #111827;
    border: 1px solid #334155;
    border-radius: 16px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: .2s;
}
.answer:hover {
    transform: translateX(5px);
    border-color: #6366f1;
    background: #172033;
}
.answer.correct {
    background: rgba(16,185,129,.15);
    border-color: #10b981;
    animation: correct .4s ease;
}
.answer.wrong {
    background: rgba(244,63,94,.15);
    border-color: #f43f5e;
    animation: wrong .35s ease;
}
@keyframes correct {
    50% {
        transform: scale(1.03);
    }
}
@keyframes wrong {
    25% {
        transform: translateX(-7px);
    }
    75% {
        transform: translateX(7px);
    }
}
.answer:disabled {
    cursor: default;
}
/* ĎALEJ */
.next-btn {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: #6366f1;
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: none;
}
/* VÝSLEDOK */
#resultScreen {
    display: none;
    text-align: center;
}
.result-icon {
    font-size: 70px;
}
.score {
    font-size: 62px;
    font-weight: 900;
    background: linear-gradient(90deg,#22d3ee,#818cf8,#c084fc);
    -webkit-background-clip: text;
    color: transparent;
    margin: 10px 0;
}
.result-message {
    color: #94a3b8;
    margin-bottom: 25px;
}
/* TABUĽKA */
.results-title {
    text-align: left;
    font-size: 19px;
    margin-bottom: 12px;
}
.table {
    border: 1px solid #334155;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
}
.table-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px;
    padding: 13px 15px;
    border-bottom: 1px solid #273449;
}
.table-row:last-child {
    border-bottom: none;
}
.table-header {
    color: #67e8f9;
    font-weight: 800;
    background: #111827;
}
.table-row span:nth-child(2),
.table-row span:nth-child(3) {
    text-align: center;
}
.empty {
    padding: 20px;
    color: #64748b;
}
/* MOBIL */
@media(max-width:600px) {
    body {
        padding: 10px;
    }
    .card {
        padding: 22px;
        border-radius: 23px;
    }
    h1 {
        font-size: 32px;
    }
    .question {
        font-size: 20px;
    }
    .info {
        flex-direction: column;
        gap: 7px;
    }
    .table-row {
        grid-template-columns: 1fr 65px 65px;
        font-size: 14px;
    }
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<!-- ================= ÚVOD ================= -->
<div id="startScreen">
<div class="dna">🧬</div>
<div class="logo">
BIOQUIZ 2.0
</div>
<h1>
Biologický <span class="gradient">kvíz</span>
</h1>
<p class="subtitle">
Otestuj svoje vedomosti z biológie.<br>
10 otázok • časovač • výsledky
</p>
<input
    id="nameInput"
    class="name-input"
    type="text"
    maxlength="20"
    placeholder="Zadaj svoje meno..."
>
<button
    class="main-btn"
    onclick="startQuiz()"
>
🚀 Spustiť kvíz
</button>
<div class="info">
<span>🧬 10 otázok</span>
<span>⏱️ 20 sekúnd</span>
<span>🏆 Výsledky</span>
</div>
</div>
<!-- ================= KVÍZ ================= -->
<div id="quizScreen">
<div class="quiz-top">
<div>
<div class="player" id="playerName"></div>
<div class="question-count" id="questionNumber">
Otázka 1 z 10
</div>
</div>
<div class="timer-box" id="timerBox">
⏱️ <span id="timer">20</span>
</div>
</div>
<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
<h2
    class="question"
    id="question"
></h2>
<div
    class="answers"
    id="answers"
></div>
<button
    class="next-btn"
    id="nextButton"
    onclick="nextQuestion()"
>
Ďalšia otázka →
</button>
</div>
<!-- ================= VÝSLEDOK ================= -->
<div id="resultScreen">
<div class="result-icon">🏆</div>
<h1>Hotovo!</h1>
<p id="resultPlayer"></p>
<div
    class="score"
    id="finalScore"
>
0%
</div>
<p
    class="result-message"
    id="resultMessage"
></p>
<h3 class="results-title">
📊 Tabuľka výsledkov
</h3>
<div class="table">
<div class="table-row table-header">
<span>Hráč</span>
<span>%</span>
<span>Body</span>
</div>
<div id="resultsTable"></div>
</div>
<button
    class="main-btn"
    onclick="restartQuiz()"
>
🔄 Hrať znova
</button>
</div>
</div>
</div>
<script>
/* =========================================
   OTÁZKY
========================================= */
const questions = [
{
question:"Ktorý orgán je hlavnou súčasťou dýchacej sústavy?",
answers:[
"Žalúdok",
"Pľúca",
"Pečeň",
"Obličky"
],
correct:1
},
{
question:"Ktorá časť bunky obsahuje genetickú informáciu?",
answers:[
"Jadro",
"Ribozóm",
"Bunková stena",
"Vakuola"
],
correct:0
},
{
question:"Ako sa nazýva proces, pri ktorom rastliny využívajú svetlo na tvorbu organických látok?",
answers:[
"Dýchanie",
"Trávenie",
"Fotosyntéza",
"Rozmnožovanie"
],
correct:2
},
{
question:"Ktorá krvná skupina sa označuje ako univerzálny darca červených krviniek?",
answers:[
"AB",
"A",
"B",
"0"
],
correct:3
},
{
question:"Ktorý orgán pumpuje krv do celého tela?",
answers:[
"Srdce",
"Pečeň",
"Oblička",
"Žalúdok"
],
correct:0
},
{
question:"Koľko párov chromozómov má človek?",
answers:[
"46 párov",
"23 párov",
"22 párov",
"44 párov"
],
correct:1
},
{
question:"Ktorá časť rastliny prijíma vodu a minerálne látky z pôdy?",
answers:[
"Kvet",
"List",
"Koreň",
"Plod"
],
correct:2
},
{
question:"Ktorý vitamín si telo vytvára pôsobením slnečného žiarenia?",
answers:[
"Vitamín C",
"Vitamín B12",
"Vitamín D",
"Vitamín K"
],
correct:2
},
{
question:"Ako sa nazývajú bunky, ktoré pomáhajú chrániť telo pred infekciami?",
answers:[
"Červené krvinky",
"Biele krvinky",
"Krvné doštičky",
"Neuróny"
],
correct:1
},
{
question:"Ktorý orgán je hlavnou súčasťou centrálnej nervovej sústavy?",
answers:[
"Koža",
"Črevo",
"Pečeň",
"Mozog"
],
correct:3
}
];
/* =========================================
   PREMENNÉ
========================================= */
let currentQuestion = 0;
let score = 0;
let playerName = "";
let answered = false;
let timer;
let timeLeft = 20;
/* =========================================
   ZVUKY
   Vytvárajú sa priamo v prehliadači.
========================================= */
let audioContext;
function playSound(type) {
    try {
        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }
        const oscillator =
            audioContext.createOscillator();
        const gain =
            audioContext.createGain();
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        if(type === "correct") {
            oscillator.frequency.setValueAtTime(
                600,
                audioContext.currentTime
            );
            oscillator.frequency.exponentialRampToValueAtTime(
                1000,
                audioContext.currentTime + .15
            );
        } else {
            oscillator.frequency.setValueAtTime(
                250,
                audioContext.currentTime
            );
            oscillator.frequency.exponentialRampToValueAtTime(
                120,
                audioContext.currentTime + .2
            );
        }
        gain.gain.setValueAtTime(
            .12,
            audioContext.currentTime
        );
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .25
        );
        oscillator.start();
        oscillator.stop(
            audioContext.currentTime + .25
        );
    } catch(e) {}
}
/* =========================================
   SPUSTENIE
========================================= */
function startQuiz() {
    playerName =
        document.getElementById("nameInput")
        .value.trim();
    if(!playerName) {
        alert("Najprv zadaj svoje meno 🙂");
        return;
    }
    document.getElementById("startScreen")
        .style.display = "none";
    document.getElementById("quizScreen")
        .style.display = "block";
    document.getElementById("playerName")
        .textContent = "👤 " + playerName;
    currentQuestion = 0;
    score = 0;
    loadQuestion();
}
/* =========================================
   NAČÍTANIE OTÁZKY
========================================= */
function loadQuestion() {
    answered = false;
    clearInterval(timer);
    timeLeft = 20;
    updateTimer();
    timer =
        setInterval(countdown,1000);
    const q =
        questions[currentQuestion];
    document.getElementById("question")
        .textContent = q.question;
    document.getElementById("questionNumber")
        .textContent =
        `Otázka ${currentQuestion + 1} z ${questions.length}`;
    document.getElementById("progressBar")
        .style.width =
        `${((currentQuestion + 1) /
        questions.length) * 100}%`;
    const answers =
        document.getElementById("answers");
    answers.innerHTML = "";
    q.answers.forEach((answer,index)=>{
        const button =
            document.createElement("button");
        button.className = "answer";
        button.textContent =
            `${String.fromCharCode(65 + index)}) ${answer}`;
        button.onclick =
            () => selectAnswer(index);
        answers.appendChild(button);
    });
    document.getElementById("nextButton")
        .style.display = "none";
}
/* =========================================
   ČASOVAČ
========================================= */
function countdown() {
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0) {
        clearInterval(timer);
        if(!answered) {
            answered = true;
            showCorrectAnswer();
            playSound("wrong");
            document.getElementById("nextButton")
                .style.display = "block";
        }
    }
}
function updateTimer() {
    const timerElement =
        document.getElementById("timer");
    const timerBox =
        document.getElementById("timerBox");
    timerElement.textContent =
        timeLeft;
    if(timeLeft <= 5) {
        timerBox.classList.add("timer-danger");
    } else {
        timerBox.classList.remove("timer-danger");
    }
}
/* =========================================
   ODPOVEĎ
========================================= */
function selectAnswer(selectedIndex) {
    if(answered) return;
    answered = true;
    clearInterval(timer);
    const correctIndex =
        questions[currentQuestion].correct;
    const buttons =
        document.querySelectorAll(".answer");
    buttons.forEach((button,index)=>{
        button.disabled = true;
        if(index === correctIndex) {
            button.classList.add("correct");
        }
    });
    if(selectedIndex === correctIndex) {
        score++;
        playSound("correct");
    } else {
        buttons[selectedIndex]
            .classList.add("wrong");
        playSound("wrong");
    }
    document.getElementById("nextButton")
        .style.display = "block";
}
/* =========================================
   UKÁŽ SPRÁVNU ODPOVEĎ
========================================= */
function showCorrectAnswer() {
    const correctIndex =
        questions[currentQuestion].correct;
    const buttons =
        document.querySelectorAll(".answer");
    buttons.forEach((button,index)=>{
        button.disabled = true;
        if(index === correctIndex) {
            button.classList.add("correct");
        }
    });
}
/* =========================================
   ĎALŠIA OTÁZKA
========================================= */
function nextQuestion() {
    currentQuestion++;
    if(currentQuestion < questions.length) {
        loadQuestion();
    } else {
        finishQuiz();
    }
}
/* =========================================
   KONIEC
========================================= */
function finishQuiz() {
    clearInterval(timer);
    document.getElementById("quizScreen")
        .style.display = "none";
    document.getElementById("resultScreen")
        .style.display = "block";
    const percentage =
        Math.round(
            (score / questions.length) * 100
        );
    document.getElementById("finalScore")
        .textContent =
        percentage + "%";
    document.getElementById("resultPlayer")
        .textContent =
        playerName +
        " • " +
        score +
        "/" +
        questions.length +
        " správnych odpovedí";
    let message;
    if(percentage >= 90) {
        message =
        "🏆 Fantastický výsledok! Biológiu ovládaš veľmi dobre.";
    } else if(percentage >= 70) {
        message =
        "👏 Veľmi dobrý výsledok! Máš dobré vedomosti.";
    } else if(percentage >= 50) {
        message =
        "👍 Celkom dobré! Ešte trochu precvičovania.";
    } else {
        message =
        "📚 Nevadí! Skús si zopakovať biológiu a zahraj si znova.";
    }
    document.getElementById("resultMessage")
        .textContent = message;
    saveResult(
        playerName,
        percentage,
        score
    );
    showResults();
}
/* =========================================
   TABUĽKA VÝSLEDKOV
========================================= */
function saveResult(name,percentage,score) {
    let results =
        JSON.parse(
            localStorage.getItem("bioQuizResults")
        ) || [];
    results.push({
        name:name,
        percentage:percentage,
        score:score
    });
    results.sort(
        (a,b) =>
        b.percentage - a.percentage
    );
    results =
        results.slice(0,10);
    localStorage.setItem(
        "bioQuizResults",
        JSON.stringify(results)
    );
}
function showResults() {
    const results =
        JSON.parse(
            localStorage.getItem("bioQuizResults")
        ) || [];
    const table =
        document.getElementById("resultsTable");
    table.innerHTML = "";
    if(results.length === 0) {
        table.innerHTML =
        `<div class="empty">
        Zatiaľ žiadne výsledky.
        </div>`;
        return;
    }
    results.forEach((result,index)=>{
        const row =
            document.createElement("div");
        row.className =
            "table-row";
        row.innerHTML = `
            <span>${index + 1}. ${escapeHTML(result.name)}</span>
            <span>${result.percentage}%</span>
            <span>${result.score}/10</span>
        `;
        table.appendChild(row);
    });
}
/* Ochrana mena pred HTML kódom */
function escapeHTML(text) {
    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
/* =========================================
   REŠTART
========================================= */
function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    document.getElementById("resultScreen")
        .style.display = "none";
    document.getElementById("startScreen")
        .style.display = "block";
    document.getElementById("nameInput")
        .value = "";
}
</script>
</body>
</html>
